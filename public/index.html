    <!-- RAZORPAY - Loaded asynchronously with error handling -->
    <!-- ========================================================== -->
    <script>
      // ✅ Razorpay error handler - MUST be before loading Razorpay
      (function() {
        // Store original error handlers
        var originalOnError = window.onerror;
        var originalUnhandledRejection = window.onunhandledrejection;
        
        // ✅ Global error handler for Razorpay
        window.onerror = function(message, source, lineno, colno, error) {
          if (message && typeof message === 'string' && (
            message.includes('backends') ||
            message.includes('undefined') ||
            message.includes('t.backends') ||
            message.includes('Razorpay') ||
            message.includes('razorpay')
          )) {
            console.warn('⚠️ Razorpay script error caught and suppressed:', message);
            return true; // ✅ Prevent default error handling
          }
          
          // ✅ Pass through other errors
          if (originalOnError) {
            return originalOnError(message, source, lineno, colno, error);
          }
          return false;
        };
        
        // ✅ Catch unhandled promise rejections
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var message = reason && reason.message ? reason.message : String(reason || '');
          
          if (message.includes('backends') || 
              message.includes('undefined') || 
              message.includes('Razorpay') ||
              message.includes('razorpay')) {
            console.warn('⚠️ Razorpay promise rejection caught:', message);
            e.preventDefault();
            return true;
          }
          
          if (originalUnhandledRejection) {
            return originalUnhandledRejection(e);
          }
        });
        
        // ✅ Lazy load Razorpay function
        window.loadRazorpay = function() {
          return new Promise(function(resolve, reject) {
            if (window.Razorpay) {
              resolve(window.Razorpay);
              return;
            }
            
            var existingScript = document.querySelector('script[src*="razorpay"]');
            if (existingScript) {
              var checkLoaded = setInterval(function() {
                if (window.Razorpay) {
                  clearInterval(checkLoaded);
                  resolve(window.Razorpay);
                }
              }, 100);
              
              setTimeout(function() {
                clearInterval(checkLoaded);
                reject(new Error('Razorpay load timeout'));
              }, 10000);
              return;
            }
            
            var script = document.createElement('script');
            script.src = 'https://checkout.razorpay.com/v1/checkout.js';
            script.async = true;
            script.onload = function() {
              if (window.Razorpay) {
                resolve(window.Razorpay);
              } else {
                reject(new Error('Razorpay failed to load'));
              }
            };
            script.onerror = function() {
              reject(new Error('Razorpay script failed to load'));
            };
            document.head.appendChild(script);
          });
        };
      })();
    </script>

    <!-- ✅ FIXED: PERFORMANCE MONITORING -->
    <!-- ========================================================== -->
    <script>
      // ✅ Suppress Razorpay preload warnings (MUST be first)
      (function suppressRazorpayWarnings() {
        // ✅ Override console.warn
        var originalWarn = console.warn;
        console.warn = function() {
          var args = Array.from(arguments);
          var msg = args[0] || '';
          if (typeof msg === 'string' && (
            msg.includes('preloaded with link preload') ||
            msg.includes('checkout-static-next.razorpay.com') ||
            msg.includes('build/undefined') ||
            msg.includes('preload tag are set correctly') ||
            msg.includes('Razorpay')
          )) {
            // ✅ Suppress Razorpay preload warnings
            return;
          }
          // ✅ Pass through other warnings
          originalWarn.apply(console, args);
        };
        
        // ✅ Override console.error for Razorpay
        var originalError = console.error;
        console.error = function() {
          var args = Array.from(arguments);
          var msg = args[0] || '';
          if (typeof msg === 'string' && (
            msg.includes('preload') ||
            msg.includes('razorpay') ||
            msg.includes('Razorpay') ||
            msg.includes('build/undefined')
          ) && !msg.includes('Failed to load')) {
            // ✅ Suppress Razorpay errors
            return;
          }
          // ✅ Pass through other errors
          originalError.apply(console, args);
        };
      })();

      // ✅ Web Vitals reporting
      if ('performance' in window && 'PerformanceObserver' in window) {
        try {
          var observer = new PerformanceObserver(function(list) {
            list.getEntries().forEach(function(entry) {
              if (entry.entryType === 'largest-contentful-paint') {
                console.log('LCP:', entry.startTime);
              }
              if (entry.entryType === 'first-input') {
                console.log('FID:', entry.processingStart - entry.startTime);
              }
              if (entry.entryType === 'layout-shift') {
                console.log('CLS:', entry.value);
              }
            });
          });
          observer.observe({ type: 'largest-contentful-paint', buffered: true });
          observer.observe({ type: 'first-input', buffered: true });
          observer.observe({ type: 'layout-shift', buffered: true });
        } catch (e) {
          // Silently fail
        }
      }

      // ✅ Service Worker with error handling
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(error) {
            // ✅ Silent fail - service worker is optional
            console.log('Service worker registration skipped:', error.message);
          });
        });
      }

      // ✅ Handle online/offline status
      window.addEventListener('online', function() {
        console.log('🟢 App is online');
        document.dispatchEvent(new CustomEvent('app:online'));
      });
      
      window.addEventListener('offline', function() {
        console.log('🔴 App is offline');
        document.dispatchEvent(new CustomEvent('app:offline'));
      });

      // ✅ Mark first paint for performance tracking
      if (window.performance && window.performance.mark) {
        window.performance.mark('html_loaded');
      }
    </script>

    <!-- ========================================================== -->
    <!-- ✅ FIXED: GLOBAL ERROR HANDLING -->
    <!-- ========================================================== -->
    <script>
      // ✅ Global error handler with Razorpay filtering
      window.addEventListener('error', function(event) {
        var message = event.message || '';
        var filename = event.filename || '';
        
        // ✅ Skip Razorpay preload errors
        if (message && (
          message.includes('preload') || 
          message.includes('razorpay') ||
          message.includes('Razorpay') ||
          message.includes('backends') ||
          message.includes('build/undefined')
        )) {
          event.preventDefault();
          return;
        }
        
        // ✅ Log other errors
        console.error('Global Error:', {
          message: message,
          filename: filename,
          lineno: event.lineno,
          colno: event.colno,
          stack: event.error?.stack
        });
      }, true);

      // ✅ Unhandled promise rejection handler
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var message = reason && reason.message ? reason.message : String(reason || '');
        
        // ✅ Skip Razorpay errors
        if (message.includes('preload') || 
            message.includes('razorpay') || 
            message.includes('Razorpay') ||
            message.includes('backends') ||
            message.includes('build/undefined')) {
          event.preventDefault();
          return;
        }
        
        console.error('Unhandled Promise Rejection:', reason);
      });
    </script>
