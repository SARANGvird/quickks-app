    <!-- Razorpay: DO NOT load globally. We will load on-demand -->
    <script>
      // Lazy loader - call window.loadRazorpay() only on checkout page
      window.loadRazorpay = function() {
        return new Promise(function(resolve, reject) {
          if (window.Razorpay) return resolve(window.Razorpay);
          var script = document.createElement('script');
          script.src = 'https://checkout.razorpay.com/v1/checkout.js';
          script.onload = () => resolve(window.Razorpay);
          script.onerror = () => reject(new Error('Razorpay failed to load'));
          document.head.appendChild(script);
        });
      };
    </script>

    <link rel="canonical" href="https://quickks.com" />
    
    <script type="application/ld+json">

    <!-- REMOVE service worker for now - CRA doesn't need it unless you have PWA setup -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(var registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
